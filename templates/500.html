<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Error del sistema · HALU</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#eef3fb;color:#1e293b;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
    .card{background:#fff;border-radius:20px;box-shadow:0 10px 40px rgba(13,59,102,.12);max-width:480px;width:100%;overflow:hidden;text-align:center}
    .hero{background:linear-gradient(135deg,#0d3b66 0%,#1d4ed8 100%);padding:2.4rem 2rem 2rem;color:#fff}
    .circle{width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;font-size:2.2rem}
    .hero h1{font-size:1.4rem;font-weight:800}
    .body{padding:1.8rem}
    .body p{color:#64748b;font-size:.95rem;line-height:1.6;margin-bottom:1.4rem}
    .btn{display:inline-block;background:#1d4ed8;color:#fff;text-decoration:none;padding:.7rem 1.5rem;border-radius:10px;font-weight:600;font-size:.92rem}
    .en{display:block;color:#94a3b8;font-size:.82rem;margin-top:.5rem}
  </style>
</head>
<body>
  <div class="card">
    <div class="hero">
      <div class="circle">🛠️</div>
      <h1>Algo salió mal</h1>
    </div>
    <div class="body">
      <p>
        Tuvimos un inconveniente al procesar tu solicitud. Por favor, intenta de nuevo en unos minutos.
        <span class="en">Something went wrong. Please try again in a few minutes.</span>
      </p>
      <a class="btn" href="/">Volver al inicio</a>
    </div>
  </div>
</body>
</html>
