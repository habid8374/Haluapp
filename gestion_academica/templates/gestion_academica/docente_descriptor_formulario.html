{% extends "base_academico.html" %}
{% load i18n %}
{% load crispy_forms_tags %}
{% block titulo %}{% trans "Formulario de Descriptor" %}{% endblock %}
{% block contenido %}
<div class="container mt-4">
    <h1>{% trans "Formulario de Descriptor de Logro" %}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-success">{% trans "Guardar" %}</button>
        <a href="{% url 'gestion_academica:docente_lista_descriptores' %}" class="btn btn-secondary">{% trans "Cancelar" %}</a>
    </form>
</div>
{% endblock %}
