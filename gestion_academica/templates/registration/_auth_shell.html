{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block titulo %}HALU · Mi cuenta{% endblock %}</title>
  <link rel="icon" href="{% static 'favicon.ico' %}" type="image/x-icon">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    /* Mismo look & feel del login (registration/login.html), para que todo
       el flujo de cuenta se sienta como una sola experiencia HALU PULSE. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; }
    .page { display: flex; height: 100vh; width: 100vw; }
    .school-panel {
      flex: 0 0 55%;
      position: relative;
      overflow: hidden;
      background: #0f172a;
    }
    .school-panel video {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; z-index: 1;
    }
    .school-panel::after {
      content: ''; position: absolute; inset: 0;
      background: rgba(10, 20, 50, 0.52); z-index: 2;
    }
    .school-brand {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%); z-index: 10;
      text-align: center; width: 90%;
    }
    .school-brand img {
      height: 72px;
      filter: brightness(0) invert(1) drop-shadow(0 4px 16px rgba(0,0,0,.4));
      margin-bottom: 16px; display: block; margin-left: auto; margin-right: auto;
    }
    .school-brand .bn {
      font-size: 2.4rem; font-weight: 900; color: #fff;
      letter-spacing: 6px; text-shadow: 0 2px 16px rgba(0,0,0,.5);
    }
    .school-brand .bs {
      font-size: .82rem; color: rgba(255,255,255,.85);
      letter-spacing: 2.5px; text-transform: uppercase;
      margin-top: 6px; font-weight: 600; text-shadow: 0 1px 8px rgba(0,0,0,.4);
    }
    .school-brand .tagline {
      margin-top: 18px; font-size: .92rem; color: rgba(255,255,255,.8);
      font-style: italic; max-width: 260px; line-height: 1.6;
      margin-left: auto; margin-right: auto; text-shadow: 0 1px 8px rgba(0,0,0,.4);
    }
    .brand-line {
      width: 48px; height: 3px;
      background: linear-gradient(90deg, #60a5fa, #93c5fd);
      border-radius: 2px; margin: 10px auto 0;
    }
    .form-panel {
      flex: 1; display: flex; align-items: center; justify-content: center;
      background: #f8faff; padding: 2rem; position: relative; overflow-y: auto;
    }
    .form-panel::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
      background: linear-gradient(90deg, #1e1b4b, #1d4ed8, #3b82f6, #60a5fa, #3b82f6, #1d4ed8, #1e1b4b);
      background-size: 300% 100%; animation: blueBar 5s linear infinite;
    }
    @keyframes blueBar { 0% { background-position: 0% 0; } 100% { background-position: 300% 0; } }
    .form-panel::after {
      content: ''; position: absolute; bottom: -60px; right: -60px;
      width: 220px; height: 220px; border-radius: 50%;
      background: radial-gradient(circle, rgba(59,130,246,.08), transparent 70%);
      pointer-events: none;
    }
    .form-box { width: 100%; max-width: 400px; animation: riseUp .6s cubic-bezier(.22,.68,0,1.2) both; }
    @keyframes riseUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    .form-header { display: flex; align-items: center; gap: 12px; margin-bottom: 2rem; }
    .form-header img { height: 44px; }
    .form-header .ht { font-size: 1.5rem; font-weight: 900; color: #1e1b4b; letter-spacing: 1px; line-height: 1; }
    .form-header .hs { font-size: .68rem; color: #3b82f6; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700; margin-top: 2px; }
    .greeting h1 { font-size: 1.5rem; font-weight: 800; color: #1e1b4b; margin-bottom: 4px; }
    .greeting p { font-size: .88rem; color: #64748b; margin-bottom: 1.8rem; line-height: 1.5; }
    .alert-err {
      background: #eff6ff; border: 1.5px solid #bfdbfe; border-left: 4px solid #2563eb;
      border-radius: 10px; padding: .75rem 1rem; display: flex; align-items: center;
      gap: .6rem; color: #1d4ed8; font-size: .85rem; font-weight: 600;
      margin-bottom: 1.2rem; animation: shake .4s ease;
    }
    @keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-5px)} 40%,80%{transform:translateX(5px)} }
    .alert-info {
      background: #eff6ff; border: 1.5px solid #bfdbfe; border-radius: 10px;
      padding: .75rem 1rem; color: #1d4ed8; font-size: .85rem; margin-bottom: 1.2rem;
    }
    .field-wrap { position: relative; margin-bottom: 1.3rem; }
    .field-wrap input {
      width: 100%; padding: 1rem 2.8rem 0.6rem 1rem; border: 1.5px solid #e2e8f0;
      border-radius: 12px; font-size: .95rem; color: #1e293b; background: #fff;
      outline: none; transition: border-color .2s, box-shadow .2s;
    }
    .field-wrap input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.13); }
    .field-wrap label {
      position: absolute; left: 1rem; top: 50%; transform: translateY(-50%);
      font-size: .9rem; color: #94a3b8; pointer-events: none; transition: all .18s;
      background: #fff; padding: 0 4px;
    }
    .field-wrap input:focus ~ label,
    .field-wrap input:not(:placeholder-shown) ~ label { top: 0; font-size: .7rem; color: #3b82f6; font-weight: 700; }
    .field-wrap .fi-ico {
      position: absolute; right: 1rem; top: 50%; transform: translateY(-50%);
      color: #cbd5e1; font-size: 1rem; pointer-events: none; transition: color .18s;
    }
    .field-wrap input:focus ~ .fi-ico { color: #3b82f6; }
    .field-wrap .pw-toggle { pointer-events: all; cursor: pointer; }
    .btn-ingresar {
      width: 100%; padding: .9rem;
      background: linear-gradient(135deg, #1e1b4b, #1d4ed8, #3b82f6);
      background-size: 200% 100%; background-position: 0% 50%;
      border: none; border-radius: 12px; color: #fff; font-size: 1rem; font-weight: 800;
      cursor: pointer; position: relative; overflow: hidden;
      transition: background-position .4s, transform .15s, box-shadow .2s;
      box-shadow: 0 4px 20px rgba(29,78,216,.35); margin-top: .4rem;
    }
    .btn-ingresar:hover { background-position: 100% 50%; transform: translateY(-2px); box-shadow: 0 8px 28px rgba(29,78,216,.45); }
    .btn-ingresar:active { transform: translateY(0); }
    .btn-ingresar::after {
      content: ''; position: absolute; top: 0; left: -80%; width: 50%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.2), transparent);
      transition: left .5s;
    }
    .btn-ingresar:hover::after { left: 130%; }
    .form-foot { margin-top: 1.5rem; text-align: center; }
    .form-foot a { color: #1d4ed8; font-size: .82rem; font-weight: 600; text-decoration: none; }
    .form-foot a:hover { text-decoration: underline; }
    .estado-icono { font-size: 3rem; margin-bottom: .5rem; text-align: center; }
    @media (max-width: 820px) {
      html, body { overflow-x: hidden; overflow-y: auto; height: auto; }
      .page { flex-direction: column; height: auto; min-height: 100vh; }
      .school-panel { flex: 0 0 auto; height: 180px; }
      .school-brand {
        top: 50%; left: 50%; transform: translate(-50%, -50%);
        display: flex; align-items: center; gap: 14px; white-space: nowrap;
        text-align: left; width: auto;
      }
      .school-brand img { height: 44px; margin: 0; }
      .school-brand .bn { font-size: 1.7rem; letter-spacing: 3px; }
      .school-brand .bs { font-size: .62rem; letter-spacing: 1.5px; }
      .school-brand .tagline { display: none; }
      .brand-line { display: none; }
      .form-panel { flex: 1; padding: 1.8rem 1.2rem 2rem; min-height: calc(100vh - 180px); }
      .form-box { max-width: 100%; }
      .form-header { margin-bottom: 1.3rem; }
      .form-header img { height: 36px; }
      .form-header .ht { font-size: 1.3rem; }
      .greeting h1 { font-size: 1.25rem; }
      .greeting p { font-size: .85rem; margin-bottom: 1.3rem; }
      .field-wrap input { font-size: 16px; padding: 1rem 2.8rem .6rem 1rem; }
      .field-wrap label { font-size: 16px; }
      .field-wrap input:focus ~ label,
      .field-wrap input:not(:placeholder-shown) ~ label { font-size: .72rem; }
      .btn-ingresar { padding: 1rem; font-size: 1rem; }
      .form-foot { margin-top: 1.2rem; }
    }
    @media (max-width: 400px) {
      .school-panel { height: 150px; }
      .form-panel { min-height: calc(100vh - 150px); padding: 1.4rem 1rem 1.8rem; }
      .school-brand .bn { font-size: 1.5rem; }
      .form-panel::before { height: 3px; }
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
<div class="page">
  <div class="school-panel">
    <video autoplay muted loop playsinline>
      <source src="{% static 'core/video/login_bg.mp4' %}" type="video/mp4">
    </video>
    <div class="school-brand">
      <img src="{% static 'core/img/logo_mi_software.png' %}" alt="HALU">
      <div class="bn">HALU</div>
      <div class="bs">Sistema de Gestión Escolar</div>
      <div class="brand-line"></div>
      <div class="tagline">"Educando con tecnología, conectando comunidades"</div>
    </div>
  </div>
  <div class="form-panel">
    <div class="form-box">
      <div class="form-header">
        <img src="{% static 'core/img/logo_mi_software.png' %}" alt="HALU">
        <div>
          <div class="ht">HALU</div>
          <div class="hs">Plataforma Educativa</div>
        </div>
      </div>
      {% block auth_content %}{% endblock %}
    </div>
  </div>
</div>
{% block extra_js %}{% endblock %}
</body>
</html>
