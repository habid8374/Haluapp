{% extends "registration/_auth_shell.html" %}
{% block titulo %}HALU · Contraseña actualizada{% endblock %}
{% block auth_content %}
<div class="greeting" style="text-align:center;">
  <div class="estado-icono" style="color:#16a34a;"><i class="bi bi-check-circle-fill"></i></div>
  <h1>¡Contraseña actualizada! 🎉</h1>
  <p>Ya puedes iniciar sesión con tu nueva contraseña.</p>
</div>
<a href="{% url 'login' %}" class="btn-ingresar" style="display:block;text-align:center;text-decoration:none;">
  <span class="btn-text"><i class="bi bi-door-open me-2"></i>Ir a iniciar sesión</span>
</a>
{% endblock %}
